<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire Responses - Inventory Engine</title>
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --border: #e7e5e4;
    --text: #1c1917;
    --text-secondary: #57534e;
    --text-muted: #a8a29e;
    --accent: #0c4a6e;
    --accent-light: #e0f2fe;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 800px; margin: 0 auto; padding: 40px 24px 80px; }
  header { margin-bottom: 32px; }
  header .label {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
  }
  header h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  header p { font-size: 14px; color: var(--text-secondary); }
  .status-bar {
    background: var(--accent-light); border-left: 3px solid var(--accent);
    padding: 12px 16px; margin-bottom: 32px; font-size: 14px; color: var(--accent);
  }
  .status-bar .count { font-weight: 700; }
  .refresh-btn {
    background: var(--accent); color: white; border: none; padding: 8px 16px;
    font-size: 13px; font-weight: 600; cursor: pointer; margin-left: 12px;
    font-family: inherit;
  }
  .refresh-btn:hover { opacity: 0.9; }
  .no-responses {
    text-align: center; padding: 60px 20px; color: var(--text-muted);
    font-size: 15px;
  }
  .respondent {
    background: var(--surface); border: 1px solid var(--border);
    margin-bottom: 24px; overflow: hidden;
  }
  .respondent-header {
    padding: 16px 20px; background: var(--accent); color: white;
    display: flex; justify-content: space-between; align-items: center;
  }
  .respondent-name { font-size: 16px; font-weight: 700; }
  .respondent-meta { font-size: 13px; opacity: 0.85; }
  .section-group { padding: 0; }
  .section-title {
    padding: 12px 20px; background: #f5f5f4; font-size: 13px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--accent); border-bottom: 1px solid var(--border);
    border-top: 1px solid var(--border);
  }
  .qa-pair {
    padding: 12px 20px; border-bottom: 1px solid #f0efed;
  }
  .qa-pair:last-child { border-bottom: none; }
  .qa-q {
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .qa-a { font-size: 15px; color: var(--text); white-space: pre-wrap; }
  .qa-a.empty { color: var(--text-muted); font-style: italic; }
  .loading { text-align: center; padding: 40px; color: var(--text-muted); }
  .error { color: #dc2626; padding: 20px; background: #fef2f2; margin-bottom: 20px; font-size: 14px; }
  @media (max-width: 600px) {
    .container { padding: 20px 16px 60px; }
    .respondent-header { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="label">C2C Internal Tools</div>
    <h1>Questionnaire Responses</h1>
    <p>Promier Inventory Engine // Pre-Meeting Questionnaire</p>
  </header>

  <div class="status-bar" id="status">
    <span>Loading responses...</span>
  </div>

  <div id="content">
    <div class="loading">Fetching from Supabase...</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://sulbxwfldnesxtqbptib.supabase.co';
const SUPABASE_KEY = 'sb_publishable_p1qU5XAN3MeI4RYrHzPH2g_htIHfB44';

const SECTIONS = [
  {
    title: '01 // NetSuite & Data Infrastructure',
    fields: [
      ['ns_modules', 'Which NetSuite modules are active?'],
      ['ns_modules_other', 'Other active modules'],
      ['separate_wms', 'Separate WMS outside NetSuite?'],
      ['wms_detail', 'WMS details'],
      ['edi_detail', 'How does EDI work with retail partners?'],
      ['sales_report', 'Can you pull historical sales by SKU/month?'],
      ['sales_history_depth', 'How far back does clean sales history go?'],
      ['inventory_source', 'Where does real-time inventory live?'],
      ['in_transit_tracking', 'Does NetSuite track in-transit inventory?'],
      ['api_access', 'NetSuite API access enabled?']
    ]
  },
  {
    title: '02 // SKU & Product Data',
    fields: [
      ['sku_structure', 'How are SKUs structured?'],
      ['sku_breakdown', 'SKU breakdown across categories'],
      ['lead_times_stored', 'Are factory lead times stored per-SKU?'],
      ['moqs', 'Do products have MOQs from factory?'],
      ['moq_location', 'Where are MOQs documented?'],
      ['multi_source', 'SKUs sourced from multiple factories?']
    ]
  },
  {
    title: '03 // Current Reorder Process',
    fields: [
      ['current_process', 'Walk us through the current reorder process'],
      ['reorder_qty_method', 'How do you decide how much to reorder?'],
      ['po_method', 'How are factory POs created and tracked?'],
      ['po_method_detail', 'PO method details'],
      ['stockouts', 'Stockouts in last 12 months?'],
      ['stockout_detail', 'Stockout details'],
      ['overstock', 'Overstock situations in last 12 months?'],
      ['overstock_detail', 'Overstock details']
    ]
  },
  {
    title: '04 // Retail Programs & Demand Signals',
    fields: [
      ['program_flow', 'How does new retail program info flow internally?'],
      ['program_docs', 'Where do program details get documented?'],
      ['program_input_willing', 'Willingness to input program data into system'],
      ['retail_partner_count', 'How many active retail partners?'],
      ['replenishment_data', 'Do retailers provide ongoing replenishment forecasts?']
    ]
  },
  {
    title: '05 // Logistics & Supply Chain',
    fields: [
      ['shipping_method', 'How does inventory ship from China?'],
      ['logistics_detail', 'Logistics details'],
      ['warehouse_count', 'How many warehouse locations?'],
      ['warehouse_type', 'Warehouse type'],
      ['lead_time_variance', 'Do production lead times vary across categories?'],
      ['cny_process', 'How is CNY inventory planning handled?']
    ]
  },
  {
    title: '06 // Desired System Behavior',
    fields: [
      ['alert_recipients', 'Who should receive reorder alerts?'],
      ['alert_method', 'How should alerts be delivered?'],
      ['auto_po', 'Should system alert only, or also draft POs?'],
      ['biggest_pain', 'Biggest pain point with inventory management'],
      ['anything_else', 'Anything else we should know?']
    ]
  }
];

window._htmlContent = true;
'content ready - length: ' + 0;

function getReadableValue(responses, fieldName) {
  if (responses._readable && responses._readable[fieldName]) {
    return responses._readable[fieldName];
  }
  const raw = responses[fieldName];
  if (Array.isArray(raw)) return raw.join(', ');
  if (typeof raw === 'string' && raw.trim()) return raw;
  return '(not answered)';
}

function formatDate(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleDateString('en-US', {
    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit'
  });
}

function renderResponse(record) {
  const responses = record.responses || {};
  let html = '<div class="respondent">';
  html += '<div class="respondent-header">' +
    '<span class="respondent-name">' + escHtml(record.respondent_name) + '</span>' +
    '<span class="respondent-meta">' + escHtml(record.respondent_role || 'No role specified') + ' // ' + formatDate(record.created_at) + '</span>' +
  '</div>';
  html += '<div class="section-group">';

  SECTIONS.forEach(section => {
    const hasAnswers = section.fields.some(([key]) => {
      const val = getReadableValue(responses, key);
      return val && val !== '(not answered)' && val !== '(none selected)';
    });

    html += '<div class="section-title">' + section.title + '</div>';
    section.fields.forEach(([key, label]) => {
      const val = getReadableValue(responses, key);
      const isEmpty = !val || val === '(not answered)' || val === '(none selected)';
      html += '<div class="qa-pair">' +
        '<div class="qa-q">' + escHtml(label) + '</div>' +
        '<div class="qa-a' + (isEmpty ? ' empty' : '') + '">' + escHtml(val) + '</div>' +
      '</div>';
    });
  });

  html += '</div></div>';
  return html;
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function loadResponses() {
  const content = document.getElementById('content');
  const status = document.getElementById('status');

  try {
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/questionnaire_responses?select=*&status=eq.submitted&order=created_at.desc',
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      }
    );

    if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + (await res.text()));
    const data = await res.json();

    const real = data.filter(r => !r.respondent_name.includes('TEST'));
    const all = data;

    if (all.length === 0) {
      status.innerHTML = '<span>No responses yet.</span> <button class="refresh-btn" onclick="loadResponses()">Refresh</button>';
      content.innerHTML = '<div class="no-responses">No questionnaire responses have been submitted yet.<br>Responses will appear here automatically once someone fills out the form.</div>';
      return;
    }

    const realCount = real.length;
    const testCount = all.length - realCount;
    let statusText = '<span class="count">' + realCount + '</span> response' + (realCount !== 1 ? 's' : '') + ' received';
    if (testCount > 0) statusText += ' <span style="opacity:0.7">(+ ' + testCount + ' test)</span>';
    statusText += ' <button class="refresh-btn" onclick="loadResponses()">Refresh</button>';
    status.innerHTML = statusText;

    let html = '';
    real.forEach(r => { html += renderResponse(r); });
    if (testCount > 0) {
      html += '<div style="margin-top:12px;padding:8px 12px;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Test Submissions</div>';
      all.filter(r => r.respondent_name.includes('TEST')).forEach(r => {
        html += '<div style="opacity:0.5">' + renderResponse(r) + '</div>';
      });
    }
    content.innerHTML = html;

  } catch(err) {
    status.innerHTML = '<span style="color:#dc2626">Error loading responses</span> <button class="refresh-btn" onclick="loadResponses()">Retry</button>';
    content.innerHTML = '<div class="error">Failed to load responses: ' + escHtml(err.message) + '<br><br>Check that you have internet access and try refreshing.</div>';
  }
}

loadResponses();
setInterval(loadResponses, 60000);
</script>
</body>
</html>
